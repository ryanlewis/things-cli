baseURL = "https://things.rlew.io/"
locale = "en-GB"
title = "things-cli"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  tagline = "A small, AI-friendly CLI for Things 3 on macOS"
  # Also drawn into the social image by scripts/og/generate.py.
  headline = "Things 3 from your terminal, or from your agent"
  description = "List, add, edit and complete your Things 3 tasks from the shell. Pipe JSON into scripts. Hand your coding agent the bundled skill and it can do the same."
  # Shown in the landing page hero badge. This value is the local-dev
  # fallback only: the Pages workflow derives the real one from the newest
  # v* tag and passes it in as HUGO_PARAMS_VERSION, so a release updates the
  # badge without anyone editing this file.
  version = "0.7.0"
  repo = "ryanlewis/things-cli"
  author = "Ryan Lewis"
  # Umami analytics. Emitted only in production builds, so `hugo server`
  # does not record visits. Clear either value to turn it off.
  umami_script = "https://arloo-stats.exe.xyz/script.js"
  umami_website_id = "ca6a5ba0-17fd-4ec8-94a0-67a3c71e288f"

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false

[minify]
  [minify.tdewolff.html]
    keepQuotes = true
